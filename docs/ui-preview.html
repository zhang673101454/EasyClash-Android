<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>EasyClash Android · UI 预览</title>
  <style>
    :root {
      --bg: #f4f6f8; --card: #fff; --text: #0f172a; --muted: #475569; --faint: #94a3b8;
      --accent: #0891b2; --accent-soft: rgba(8,145,178,.1); --accent-border: rgba(8,145,178,.28);
      --border: rgba(15,23,42,.07); --radius: 14px;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; font-family: "Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
      background: linear-gradient(160deg,#e8eef2,#eef2f5); color: var(--text);
      display: flex; flex-direction: column; align-items: center; padding: 32px 16px 48px; gap: 14px;
    }
    h1 { margin: 0; font-size: 15px; font-weight: 600; color: var(--muted); }
    .hint { margin: 0; font-size: 12px; color: var(--faint); text-align: center; max-width: 360px; }
    .tabs-bar { display: flex; gap: 8px; }
    .tabs-bar button {
      border: 1px solid var(--border); background: #fff; border-radius: 999px;
      padding: 6px 14px; font-size: 12px; cursor: pointer; color: var(--muted);
    }
    .tabs-bar button.on { background: var(--accent-soft); border-color: var(--accent-border); color: var(--accent); font-weight: 600; }
    .phone {
      width: 360px; height: 720px; background: var(--bg); border-radius: 28px;
      box-shadow: 0 0 0 10px #1e293b, 0 0 0 12px #334155, 0 24px 48px rgba(15,23,42,.18);
      overflow: hidden; display: flex; flex-direction: column;
    }
    .notch { height: 28px; display: flex; align-items: center; justify-content: center; font-size: 10px; color: var(--faint); }
    .screen { flex: 1; overflow: auto; padding: 0 16px 24px; display: none; flex-direction: column; }
    .screen.on { display: flex; }
    .titlebar { display: flex; align-items: center; gap: 10px; height: 48px; }
    .logo { width: 28px; height: 28px; border-radius: 8px; background: linear-gradient(135deg,#0891b2,#22d3ee); flex-shrink: 0; }
    .brand { flex: 1; min-width: 0; }
    .brand-row { display: flex; align-items: center; gap: 8px; }
    .brand-name { font-size: 14px; font-weight: 700; }
    .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--faint); }
    .dot.on { background: var(--accent); }
    .mode-line { font-size: 11px; color: var(--faint); }
    .icon-btn {
      width: 40px; height: 40px; border: 0; background: transparent; border-radius: 10px;
      cursor: pointer; color: var(--accent); font-size: 22px; line-height: 1;
    }
    .picker {
      display: flex; background: rgba(15,23,42,.04); border-radius: 12px; padding: 3px;
      margin: 4px 0 14px; height: 40px; flex-shrink: 0;
    }
    .picker button {
      flex: 1; border: 0; background: transparent; border-radius: 10px;
      font-size: 13px; font-weight: 700; color: var(--muted); cursor: pointer;
    }
    .picker button.on {
      background: #fff; color: var(--accent); border: 1px solid var(--accent-border);
      box-shadow: 0 1px 2px rgba(15,23,42,.06);
    }
    .list { display: flex; flex-direction: column; gap: 10px; }
    .card {
      background: var(--card); border: 1px solid var(--border); border-radius: var(--radius);
      padding: 14px; cursor: pointer;
    }
    .card.active { background: var(--accent-soft); border: 1.5px solid var(--accent-border); }
    .row { display: flex; align-items: center; gap: 8px; }
    .grow { flex: 1; min-width: 0; }
    .t14 { font-size: 14px; font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .t12 { font-size: 12px; color: var(--muted); }
    .t11 { font-size: 11px; color: var(--faint); }
    .badge {
      font-size: 11px; padding: 3px 8px; border-radius: 999px;
      background: rgba(15,23,42,.06); color: var(--muted); white-space: nowrap;
    }
    .badge.on { background: var(--accent-soft); color: var(--accent); }
    .meta { display: flex; justify-content: space-between; gap: 8px; margin-top: 8px; }
    .progress { height: 4px; background: rgba(15,23,42,.06); border-radius: 999px; margin-top: 8px; overflow: hidden; }
    .progress > i { display: block; height: 100%; background: var(--accent); border-radius: 999px; }
    .node {
      display: flex; justify-content: space-between; align-items: center;
      padding: 12px 14px; border-radius: 12px; border: 1px solid var(--border);
      background: #fff; margin-bottom: 8px; font-size: 13px;
    }
    .node.on { border-color: var(--accent-border); background: var(--accent-soft); }
    .ms { font-size: 12px; color: var(--accent); font-weight: 600; }
    .form {
      background: var(--card); border: 1px solid var(--border); border-radius: var(--radius);
      padding: 14px; display: flex; flex-direction: column; gap: 10px;
    }
    .form label { font-size: 11px; font-weight: 600; color: var(--muted); }
    .form input {
      border: 1px solid var(--border); border-radius: 12px; padding: 10px 12px; font-size: 13px; outline: none;
    }
    .form .ok {
      border: 0; border-radius: 12px; padding: 10px; background: var(--accent);
      color: #fff; font-size: 13px; font-weight: 600; cursor: pointer;
    }
  </style>
</head>
<body>
  <h1>EasyClash Android · 精简预览</h1>
  <p class="hint">固定浅色 · 通知栏流量默认开 · 无设置 · 右上角 + 添加订阅 · 额度在订阅卡上 · 状态用小点</p>

  <div class="tabs-bar">
    <button type="button" class="on" data-page="home">连接</button>
    <button type="button" data-page="add">添加</button>
    <button type="button" data-page="nodes">节点</button>
  </div>

  <div class="phone">
    <div class="notch">9:41</div>

    <div class="screen on" id="home">
      <div class="titlebar">
        <div class="logo"></div>
        <div class="brand">
          <div class="brand-row">
            <span class="brand-name">EasyClash</span>
            <span class="dot on"></span>
          </div>
          <div class="mode-line">智能模式</div>
        </div>
        <button class="icon-btn" type="button" title="添加订阅" onclick="go('add')">＋</button>
      </div>
      <div class="picker">
        <button type="button" class="on">连接</button>
        <button type="button" onclick="go('nodes')">节点</button>
      </div>
      <div class="list">
        <div class="card active">
          <div class="row">
            <div class="grow t14">adaxi · 主订阅</div>
            <span class="badge on">使用中</span>
          </div>
          <div class="meta">
            <span class="t12">已用 28.1 GB / 总额 100 GB</span>
            <span class="t11">2 分钟前</span>
          </div>
          <div class="progress"><i style="width:28%"></i></div>
          <div class="t11" style="margin-top:6px">到期 2026-12-31</div>
        </div>
        <div class="card">
          <div class="row">
            <div class="grow t14">备用订阅</div>
            <span class="badge">待用</span>
          </div>
          <div class="meta">
            <span class="t12">已用 3.2 GB / 总额 50 GB</span>
            <span class="t11">昨天</span>
          </div>
          <div class="progress"><i style="width:6%"></i></div>
        </div>
      </div>
    </div>

    <div class="screen" id="add">
      <div class="titlebar">
        <div class="brand">
          <div class="brand-name">添加订阅</div>
          <div class="mode-line">粘贴 URL，可选备注</div>
        </div>
        <button class="icon-btn" type="button" style="color:var(--muted)" onclick="go('home')">✕</button>
      </div>
      <div class="form">
        <label>订阅 URL</label>
        <input type="url" placeholder="https://…" />
        <label>备注（可选）</label>
        <input type="text" placeholder="例如：主订阅" maxlength="40" />
        <button class="ok" type="button" onclick="go('home')">确认添加</button>
      </div>
    </div>

    <div class="screen" id="nodes">
      <div class="titlebar">
        <div class="logo"></div>
        <div class="brand">
          <div class="brand-row">
            <span class="brand-name">EasyClash</span>
            <span class="dot on"></span>
          </div>
          <div class="mode-line">智能模式</div>
        </div>
        <button class="icon-btn" type="button" onclick="go('add')">＋</button>
      </div>
      <div class="picker">
        <button type="button" onclick="go('home')">连接</button>
        <button type="button" class="on">节点</button>
      </div>
      <div class="node on"><span>香港 01</span><span class="ms">42 ms</span></div>
      <div class="node"><span>日本 03</span><span class="ms">68 ms</span></div>
      <div class="node"><span>新加坡 02</span><span class="ms" style="color:#e11d48">超时</span></div>
    </div>
  </div>

  <script>
    function go(id) {
      document.querySelectorAll('.tabs-bar button').forEach((b) => b.classList.toggle('on', b.dataset.page === id));
      document.querySelectorAll('.screen').forEach((s) => s.classList.remove('on'));
      document.getElementById(id).classList.add('on');
    }
    document.querySelectorAll('.tabs-bar button').forEach((btn) => btn.addEventListener('click', () => go(btn.dataset.page)));
  </script>
</body>
</html>
